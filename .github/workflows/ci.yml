name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Lint
        run: |
          uvx ruff check .
          uvx ruff format --check .
      - name: Test
        run: uv run --python 3.12 --group dev pytest -q

  statement-gate:
    # Regenerates the seeded catalog and 12 months of reports, recomputes four quarters, and fails if any
    # payee's 2026Q2 statement differs from gate/expected_2026Q2.json or if any period is off by a cent.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Recompute 2026Q2 and compare every statement
        run: |
          set -o pipefail
          mkdir -p data out
          uv run --python 3.12 royaltyledger --data data/ci gate --fresh | tee out/gate.txt
      - name: Tie-out and matching summary
        run: uv run --python 3.12 royaltyledger --data data/ci eval > out/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: gate-results
          path: out/

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t royalty-ledger:ci .
      - name: Smoke test container
        run: |
          docker run -d --name rl -p 8882:8882 royalty-ledger:ci
          for i in $(seq 1 120); do curl -sf http://localhost:8882/healthz && break; sleep 1; done
          curl -sf http://localhost:8882/api/tieout | grep '"ties_out":true'
          curl -sf http://localhost:8882/metrics | grep rl_match_rate
          docker rm -f rl
